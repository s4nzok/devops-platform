server {                                   # Define a virtual server (website)

    listen 80;                             # Listen for incoming HTTP requests on port 80

    server_name localhost;                 # Accept requests sent to localhost
                                           # Later we'll change this to a real domain

    root /usr/share/nginx/html;            # Directory containing the website files
                                           # Docker will copy our frontend files here

    index index.html;                      # Default page to serve when "/" is requested

    location / {                           # Handle all requests starting with "/"

        try_files $uri                     # 1. Check if the requested file exists
                  $uri/                    # 2. If it's a directory, look inside it
                  /index.html;             # 3. Otherwise serve index.html

    }

}
